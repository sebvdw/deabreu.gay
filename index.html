<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gay for mainframes" />
    <meta name="theme-color" content="#17130f" />
    <title>Gay for mainframes</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f0a35b'/%3E%3Cpath d='M17 18h9v20c0 5 2 8 7 8 4 0 7-3 7-8V18h9v21c0 10-6 16-16 16S17 49 17 39V18Z' fill='%2317130f'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="joke-page">
      <h1>Gay for mainframes</h1>
      <div class="photo-orbit">
        <span class="floaty floaty-heart" aria-hidden="true">♥</span>
        <span class="floaty floaty-spark" aria-hidden="true">✦</span>
        <span class="floaty floaty-disk" aria-hidden="true">💾</span>
        <span class="floaty floaty-computer" aria-hidden="true">🖥️</span>
        <span class="floaty floaty-star" aria-hidden="true">★</span>
        <figure>
          <img src="daneil_mainframe.jpeg" alt="A person hugging an IBM mainframe" />
        </figure>
      </div>
      <section class="stack-zone" aria-labelledby="stack-title">
        <h2 id="stack-title">i like to stack</h2>
        <div class="stack-game">
          <div class="stack-status" id="stack-status" aria-live="polite">stack: 0</div>
          <div id="stack-canvas" class="stack-canvas" aria-label="Three.js stacking game"></div>
          <button id="drop-button" type="button">drop block</button>
        </div>
      </section>
    </main>
    <script type="module" src="stack.js"></script>
  </body>
</html>
